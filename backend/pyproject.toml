[tool.ruff]
line-length = 100
target-version = "py312"
# Autogenerated migration scripts are not held to the style rules.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
# The local alembic/ folder would otherwise make ruff treat the library as first-party.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
